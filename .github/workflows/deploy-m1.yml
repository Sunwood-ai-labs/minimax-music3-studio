name: Build and deploy MiniMax Music 3.0 Studio to M1

on:
  push:
    branches:
      - main
    paths:
      - "acestep/**"
      - "frontend/**"
      - "deploy/m1/**"
      - "Dockerfile"
      - "Dockerfile.mcp"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-m1.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/sunwood-ai-labs/minimax-music3-studio-ui

permissions:
  contents: read
  packages: write

jobs:
  build-ui:
    name: Build ARM64 UI image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish MiniMax Studio UI
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=forge-ui
          cache-to: type=gha,mode=max,scope=forge-ui

  deploy-m1:
    name: Deploy UI, API, and MCP on M1
    needs: build-ui
    if: ${{ github.event_name == 'workflow_dispatch' || vars.M1_DEPLOY_ENABLED == 'true' }}
    # The runner is installed on the target Mac. All runtime components stay
    # on this one machine; the API uses native MPS/MLX instead of CUDA.
    runs-on: [self-hosted, m1, arm64]
    environment:
      name: m1-production
    env:
      PATH: /Applications/Docker.app/Contents/Resources/bin:/Users/admin/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
      NATIVE_ROOT: /Users/admin/ace-step-forge-native
    steps:
      - name: Check out full-stack sources
        uses: actions/checkout@v4

      - name: Sync native MPS/MLX runtime
        shell: bash
        run: |
          set -euo pipefail
          native="$NATIVE_ROOT"
          mkdir -p "$native"
          /usr/bin/rsync -a --delete \
            --exclude '.venv/' \
            --exclude 'checkpoints/' \
            --exclude '.cache/' \
            --exclude 'gradio_outputs/' \
            --exclude 'output/' \
            "$GITHUB_WORKSPACE/" "$native/"

          if [ ! -x "$HOME/.local/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          "$HOME/.local/bin/uv" sync --frozen --no-dev --python 3.11 --project "$native"

          # imageio-ffmpeg supplies a native arm64 ffmpeg binary without
          # requiring Homebrew on the deployment Mac.
          "$HOME/.local/bin/uv" pip install --python "$native/.venv/bin/python" imageio-ffmpeg
          ffmpeg_path=$("$native/.venv/bin/python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          mkdir -p "$HOME/.local/bin"
          ln -sf "$ffmpeg_path" "$HOME/.local/bin/ffmpeg"
          chmod +x "$native/deploy/m1/"*.sh
          "$native/deploy/m1/install-native-launchagents.sh"

      - name: Verify native API and MCP
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null && \
               curl -fsS http://127.0.0.1:8002/health >/dev/null; then
              echo 'Native ACE-Step API and MCP are healthy on M1'
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              tail -80 "$HOME/ace-step-native-api.log" || true
              tail -80 "$HOME/ace-step-native-mcp.log" || true
              exit 1
            fi
            sleep 2
          done

      - name: Check Docker Desktop on M1
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Pull and restart ARM64 UI edge
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/ace-step-forge"
          cp deploy/m1/compose.yml "$HOME/ace-step-forge/compose.yml"

          # The UI and both native services are on this same Mac.
          printf 'FORGE_IMAGE=%s\nFORGE_API_UPSTREAM=host.docker.internal:8001\nFORGE_PORT=3003\n' "$IMAGE_REF" > "$HOME/ace-step-forge/.env"
          chmod 600 "$HOME/ace-step-forge/.env"

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          cd "$HOME/ace-step-forge"
          docker compose config --quiet
          docker compose pull
          docker compose up -d --remove-orphans
          docker logout ghcr.io >/dev/null 2>&1 || true

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3003/healthz >/dev/null && \
               curl -fsS http://127.0.0.1:3003/api/health >/dev/null; then
              echo 'Forge UI, API, and MCP stack is healthy on M1'
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
